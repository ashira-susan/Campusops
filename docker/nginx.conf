upstream api {
  server api1:5000 max_fails=2 fail_timeout=5s;
  server api2:5000 max_fails=2 fail_timeout=5s;
}
server {
  listen 80;
  root /usr/share/nginx/html;
  location /static/ { alias /usr/share/nginx/html/; }
  location = / { try_files /index.html =404; }
  location /api/ {
    proxy_pass http://api;
    proxy_next_upstream error timeout http_502 http_503;   # one instance down => the other serves
    proxy_next_upstream_tries 2;
    proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr;
  }
}
