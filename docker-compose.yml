# v1.1: two backend instances share one database volume behind nginx. Secrets come from .env (not committed).
x-api: &api
  build: ./backend
  env_file: .env
  environment: &apienv
    APP_VERSION: v1.1.0
  volumes:
    - dbdata:/data
  restart: unless-stopped
  depends_on:
    init:
      condition: service_completed_successfully
services:
  init:                         # one-shot: create schema, run migrations, seed demo data (avoids a start-up race)
    build: ./backend
    env_file: .env
    command: ["python", "seed.py"]
    volumes:
      - dbdata:/data
    restart: "no"
  api1:
    <<: *api
    environment: { <<: *apienv, INSTANCE_ID: api-1 }
  api2:
    <<: *api
    environment: { <<: *apienv, INSTANCE_ID: api-2 }
  web:
    image: nginx:1.27-alpine
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"
    depends_on: [api1, api2]
volumes:
  dbdata:
