# v1.0: one backend instance. Secrets come from .env (not committed; see .env.example).
services:
  api:
    build: ./backend
    env_file: .env
    environment:
      INSTANCE_ID: api-1
    volumes:
      - dbdata:/data
    restart: unless-stopped
  web:
    image: nginx:1.27-alpine
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - api
volumes:
  dbdata:
